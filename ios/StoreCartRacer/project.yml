name: StoreCartRacer
options:
  bundleIdPrefix: com.cursorgames
  deploymentTarget:
    iOS: "17.0"
targets:
  StoreCartRacer:
    type: application
    platform: iOS
    sources:
      - path: StoreCartRacer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorgames.storecartracer
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Store Cart Racer
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
