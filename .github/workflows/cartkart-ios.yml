name: Cart Kart iOS Build

on:
  push:
    branches: [master, 'cursor/**']
    paths:
      - 'CartKart/**'
      - '.github/workflows/cartkart-ios.yml'
  pull_request:
    paths:
      - 'CartKart/**'
      - '.github/workflows/cartkart-ios.yml'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: CartKart
    steps:
      - uses: actions/checkout@v4

      - name: Validate project files
        run: ./scripts/validate-project.sh

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project CartKart.xcodeproj \
            -scheme CartKart \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
