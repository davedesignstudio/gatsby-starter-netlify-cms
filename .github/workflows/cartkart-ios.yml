name: Cart Kart iOS Build

on:
  push:
    branches: [master, 'cursor/**']
    paths:
      - 'CartKart/**'
      - '.github/workflows/cartkart-ios.yml'
  pull_request:
    paths:
      - 'CartKart/**'
      - '.github/workflows/cartkart-ios.yml'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: CartKart
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project CartKart.xcodeproj \
            -scheme CartKart \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      - name: Build for iOS Simulator (fallback scheme)
        if: failure()
        run: |
          xcodebuild \
            -project CartKart.xcodeproj \
            -target CartKart \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
