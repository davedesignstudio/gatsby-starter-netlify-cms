<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#f36b21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cart Dash" />
    <meta name="description" content="Race hand-built shopping carts through a supermarket after hours." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/cart-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/cart-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Cart Dash — After Hours</title>
    <script type="module" src="/src/game.js"></script>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game" aria-label="Cart Dash racing game"></canvas>

      <section id="start-screen" class="screen screen--active">
        <div class="brand">
          <span class="brand__eyebrow">Aisle 9 presents</span>
          <h1><span>Cart</span> Dash</h1>
          <div class="brand__tag"><i></i> After hours <i></i></div>
        </div>

        <div class="hero-cart" aria-hidden="true">
          <div class="speed-line speed-line--one"></div>
          <div class="speed-line speed-line--two"></div>
          <div class="hero-cart__flag">9</div>
          <div class="hero-cart__handle"></div>
          <div class="hero-cart__basket">
            <span class="bag bag--one"></span>
            <span class="bag bag--two"></span>
          </div>
          <div class="hero-cart__base"></div>
          <span class="hero-cart__wheel hero-cart__wheel--left"></span>
          <span class="hero-cart__wheel hero-cart__wheel--right"></span>
        </div>

        <div class="start-panel">
          <div class="racer-picker" aria-label="Choose your cart">
            <button class="racer-card racer-card--active" data-racer="0" aria-pressed="true">
              <span class="racer-card__number">09</span>
              <span><b>Maya</b><small>Rocket Basket</small></span>
            </button>
            <button class="racer-card" data-racer="1" aria-pressed="false">
              <span class="racer-card__number">24</span>
              <span><b>Jax</b><small>Blue Streak</small></span>
            </button>
            <button class="racer-card" data-racer="2" aria-pressed="false">
              <span class="racer-card__number">77</span>
              <span><b>Sol</b><small>Night Hauler</small></span>
            </button>
          </div>
          <button id="start-button" class="primary-button">
            <span>Start racing</span><b>→</b>
          </button>
          <p class="control-hint"><span>◀</span><span>▶</span> Steer &nbsp;•&nbsp; Grab lightning &nbsp;•&nbsp; Tap boost</p>
        </div>
      </section>

      <section id="hud" aria-label="Race information">
        <div class="hud__top">
          <div class="place"><strong id="place-value">4</strong><sup id="place-suffix">th</sup><span>place</span></div>
          <div class="race-title">Freezer Run <span>•</span> 3 laps</div>
          <button id="pause-button" class="icon-button" aria-label="Pause game"><span></span><span></span></button>
        </div>
        <div class="hud__bottom">
          <div class="lap"><span>Lap</span><b><i id="lap-value">1</i>/3</b></div>
          <div class="boost-meter">
            <div class="boost-meter__label"><span>Boost</span><b id="boost-label">Ready</b></div>
            <div class="boost-meter__track"><i id="boost-fill"></i></div>
          </div>
          <div class="speed"><b id="speed-value">0</b><span>mph</span></div>
        </div>
      </section>

      <section id="countdown" aria-live="assertive"></section>
      <div id="toast" role="status" aria-live="polite"></div>

      <div id="touch-controls" aria-label="Touch controls">
        <div class="steer-controls">
          <button id="left-button" class="control-button" aria-label="Steer left">‹</button>
          <button id="right-button" class="control-button" aria-label="Steer right">›</button>
        </div>
        <button id="boost-button" class="boost-button" aria-label="Use boost">
          <span>⚡</span><b>Boost</b>
        </button>
      </div>

      <section id="pause-screen" class="screen modal-screen" aria-hidden="true">
        <div class="modal-card">
          <span class="modal-card__eyebrow">Pit stop</span>
          <h2>Race paused</h2>
          <button id="resume-button" class="primary-button"><span>Keep racing</span><b>→</b></button>
          <button id="restart-from-pause" class="text-button">Restart race</button>
        </div>
      </section>

      <section id="finish-screen" class="screen modal-screen" aria-hidden="true">
        <div class="modal-card modal-card--finish">
          <span id="finish-eyebrow" class="modal-card__eyebrow">Race complete</span>
          <div id="finish-place" class="finish-place">1<sup>st</sup></div>
          <h2 id="finish-title">Aisle legend!</h2>
          <div class="results">
            <span><small>Time</small><b id="finish-time">00:00.00</b></span>
            <span><small>Best lap</small><b id="best-lap">00:00.00</b></span>
          </div>
          <button id="race-again-button" class="primary-button"><span>Race again</span><b>↻</b></button>
          <button id="change-cart-button" class="text-button">Change cart</button>
        </div>
      </section>

      <div id="rotate-message">
        <span class="phone-icon">↻</span>
        <b>Turn your phone sideways</b>
        <small>Cart Dash plays best in landscape.</small>
      </div>
    </main>
  </body>
</html>
