<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101d17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aisle Rush" />
    <meta name="description" content="A fast, friendly shopping-cart racing game built for touch." />
    <title>Aisle Rush — Shopping Cart Racing</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/images/cart-racer-icon.svg" />
    <link rel="stylesheet" href="/css/cart-racer.css" />
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game" aria-label="Aisle Rush racing game"></canvas>

      <section id="hud" class="hud is-hidden" aria-label="Race information">
        <div class="hud-top">
          <div class="hud-chip">
            <span class="hud-label">LAP</span>
            <strong id="lap-value">1/3</strong>
          </div>
          <div class="position" aria-label="Race position">
            <strong id="position-value">1</strong><sup id="position-suffix">ST</sup>
          </div>
          <button id="pause-button" class="icon-button" type="button" aria-label="Pause game">Ⅱ</button>
        </div>
        <div class="boost-meter" aria-label="Boost meter">
          <span>BOOST</span>
          <div class="meter-track"><i id="boost-fill"></i></div>
        </div>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="countdown" class="countdown" aria-live="assertive"></div>

      <section id="menu" class="panel menu-panel">
        <div class="eyebrow"><span></span> AFTER HOURS <span></span></div>
        <h1>AISLE<br /><em>RUSH</em></h1>
        <p class="tagline">Carts out. Lights low. Race for the last bargain.</p>

        <div class="cart-picker" role="radiogroup" aria-label="Choose your cart">
          <button class="cart-card is-selected" type="button" role="radio" aria-checked="true" data-cart="0">
            <span class="cart-preview rocket" aria-hidden="true">🛒<i>⚡</i></span>
            <strong>ROCKET</strong>
            <small>FAST + LIGHT</small>
          </button>
          <button class="cart-card" type="button" role="radio" aria-checked="false" data-cart="1">
            <span class="cart-preview hauler" aria-hidden="true">🛒<i>📦</i></span>
            <strong>HAULER</strong>
            <small>TOUGH + STEADY</small>
          </button>
          <button class="cart-card" type="button" role="radio" aria-checked="false" data-cart="2">
            <span class="cart-preview nimble" aria-hidden="true">🛒<i>🍉</i></span>
            <strong>NIMBLE</strong>
            <small>QUICK + SHARP</small>
          </button>
        </div>

        <button id="start-button" class="primary-button" type="button">
          <span>START RACE</span><b>→</b>
        </button>
        <p class="controls-hint"><span>TOUCH</span> steer with the arrows · hold boost to fly</p>
      </section>

      <section id="pause-panel" class="panel compact-panel is-hidden" aria-labelledby="pause-title">
        <div class="eyebrow">PIT STOP</div>
        <h2 id="pause-title">RACE PAUSED</h2>
        <button id="resume-button" class="primary-button" type="button"><span>KEEP RACING</span><b>→</b></button>
        <button id="restart-from-pause" class="text-button" type="button">Restart race</button>
      </section>

      <section id="finish-panel" class="panel compact-panel is-hidden" aria-labelledby="finish-title">
        <div class="eyebrow">CHECKOUT CLEARED</div>
        <div id="finish-place" class="finish-place">1<sup>ST</sup></div>
        <h2 id="finish-title">AISLE CHAMPION!</h2>
        <div class="results">
          <div><span>TIME</span><strong id="finish-time">0:00.00</strong></div>
          <div><span>COUPONS</span><strong id="finish-score">0</strong></div>
        </div>
        <button id="race-again-button" class="primary-button" type="button"><span>RACE AGAIN</span><b>↻</b></button>
        <button id="change-cart-button" class="text-button" type="button">Change cart</button>
      </section>

      <div id="touch-controls" class="touch-controls is-hidden" aria-label="Touch controls">
        <div class="steer-controls">
          <button id="left-button" type="button" aria-label="Steer left">←</button>
          <button id="right-button" type="button" aria-label="Steer right">→</button>
        </div>
        <button id="boost-button" class="boost-button" type="button" aria-label="Use boost">
          <span>⚡</span><small>BOOST</small>
        </button>
      </div>

      <button id="sound-button" class="sound-button" type="button" aria-label="Toggle sound">♪</button>
      <div class="rotate-message" aria-hidden="true">Rotate back to portrait for the best race.</div>
    </main>

    <noscript>Aisle Rush needs JavaScript enabled to race.</noscript>
    <script src="/js/game-core.js"></script>
    <script src="/js/cart-racer.js"></script>
  </body>
</html>
