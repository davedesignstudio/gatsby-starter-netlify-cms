# XcodeGen fallback.
# If the committed CartKart.xcodeproj ever gets out of sync, regenerate it with:
#   brew install xcodegen && cd CartKart && xcodegen generate
name: CartKart
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CartKart:
    type: application
    platform: iOS
    sources:
      - CartKart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CartKart
        INFOPLIST_FILE: CartKart/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: CartKart/Info.plist
