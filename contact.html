<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — dphilhowerstudio</title>
  <meta name="description" content="Contact dphilhowerstudio for logo, poster, print, and website design.">
  <link rel="icon" href="siteicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body class="page">
  <header class="inner-hero">
    <div class="top-nav">
      <a class="brand-lockup" href="index.html">
        <span class="brand-mark" aria-hidden="true">d</span>
        <span class="brand-text">
          <span class="brand-name">dphilhowerstudio</span>
          <span class="brand-meta">Contact</span>
        </span>
      </a>
      <nav class="zoom-nav" aria-label="Primary">
        <a href="index.html">Studio</a>
        <a href="services.html">Services</a>
        <a href="portfolio.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
      <button class="mobile-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-drawer">
        <span aria-hidden="true"></span>
      </button>
    </div>
    <nav class="mobile-drawer" id="mobile-drawer" aria-label="Mobile">
      <a href="index.html">Studio</a>
      <a href="services.html">Services</a>
      <a href="portfolio.html">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <h1>Join the studio</h1>
    <p>Tell us what you need — logo, poster, print, web, or a mix. We’ll get back to you soon.</p>
  </header>

  <main class="section">
    <form class="form reveal" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/contact.html">
      <input type="hidden" name="form-name" value="contact">
      <p class="sr-only">
        <label>Don’t fill this out: <input name="bot-field"></label>
      </p>
      <label>
        Name
        <input type="text" name="name" required autocomplete="name">
      </label>
      <label>
        Email
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label>
        Service
        <select name="service" required>
          <option value="">Select one</option>
          <option>Logo Design</option>
          <option>Poster Design</option>
          <option>Print Media</option>
          <option>Website Design</option>
          <option>Multiple / Other</option>
        </select>
      </label>
      <label>
        Project notes
        <textarea name="message" required placeholder="Goals, timeline, and anything we should know…"></textarea>
      </label>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
    <p class="reveal" style="margin-top:1.5rem;color:var(--muted)">
      Or email <a href="mailto:dphilhowerstudio@gmail.com" style="color:var(--accent)">dphilhowerstudio@gmail.com</a>
    </p>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> dphilhowerstudio.com</div>
    <div class="footer-links">
      <a href="index.html">Studio</a>
      <a href="services.html">Services</a>
      <a href="portfolio.html">Work</a>
    </div>
  </footer>
  <script src="js/studio.js"></script>
</body>
</html>
