<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cart Chaos: Aisle Racers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a221c;
      --paper: #d8c9a8;
      --accent: #e8a318;
      --shelf: #5a4632;
      --go: #2f9e4f;
      --use: #8b3d8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(ellipse at 50% 20%, #3a4a52 0%, #1a221c 70%);
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: #f2efe6;
      touch-action: none;
      user-select: none;
    }
    #wrap {
      position: relative;
      width: 100%; height: 100%;
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: min(100vw, 160vh);
      height: min(100vh, 62.5vw);
      max-height: 100vh;
      background: #6a7882;
      border-radius: 0;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
    }
    .panel {
      pointer-events: auto;
      text-align: center;
      padding: clamp(1rem, 3vw, 2rem);
      max-width: 42rem;
    }
    .brand {
      font-family: "Bangers", cursive;
      font-size: clamp(3rem, 10vw, 5.5rem);
      letter-spacing: .04em;
      color: var(--accent);
      text-shadow: 0 4px 0 #8a5a08, 0 10px 30px rgba(0,0,0,.4);
      line-height: 1;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .sub {
      font-weight: 700;
      font-size: clamp(1rem, 3vw, 1.4rem);
      margin-top: .35rem;
      opacity: .92;
    }
    .blurb {
      margin: .75rem auto 1.25rem;
      max-width: 28rem;
      opacity: .78;
      font-size: .95rem;
      line-height: 1.4;
    }
    .carts {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .cart-btn {
      border: 2px solid transparent;
      background: rgba(255,255,255,.08);
      color: #eee;
      padding: .55rem .85rem;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: transform .15s ease, border-color .15s ease;
    }
    .cart-btn:hover { transform: translateY(-2px); }
    .cart-btn.active { border-color: var(--accent); background: rgba(232,163,24,.18); }
    .tagline { min-height: 1.4em; opacity: .8; margin-bottom: 1.1rem; font-style: italic; }
    .cta {
      appearance: none;
      border: none;
      background: linear-gradient(180deg, #f0b43a, #d88810);
      color: #1a1508;
      font-family: "Bangers", cursive;
      font-size: 1.6rem;
      letter-spacing: .06em;
      padding: .7rem 1.6rem;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 0 #8a5a08;
      transition: transform .12s ease;
    }
    .cta:hover { transform: translateY(-2px); }
    .cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a5a08; }
    .help { margin-top: 1rem; font-size: .82rem; opacity: .65; }
    .hidden { display: none !important; }
    #hud {
      position: absolute; inset: 0; pointer-events: none;
      font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.65);
    }
    #hud .tl { position: absolute; top: 4%; left: 3%; }
    #hud .tr { position: absolute; top: 4%; right: 3%; text-align: right; }
    #hud .place { font-family: "Bangers", cursive; font-size: clamp(1.8rem, 5vw, 2.6rem); color: var(--accent); }
    #countdown {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-family: "Bangers", cursive; font-size: clamp(4rem, 14vw, 7rem);
      color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.35); pointer-events: none;
    }
    #controls {
      position: absolute; left: 0; right: 0; bottom: 3%;
      display: flex; justify-content: space-between; padding: 0 3%;
      pointer-events: none; gap: .5rem;
    }
    .ctrl-group { display: flex; gap: .5rem; pointer-events: auto; }
    .ctrl {
      width: clamp(56px, 12vw, 74px); height: clamp(48px, 10vw, 60px);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px; background: rgba(20,24,22,.55);
      color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .ctrl.gas { background: rgba(47,158,79,.72); width: clamp(70px, 14vw, 90px); }
    .ctrl.use { background: rgba(139,61,143,.72); }
    #toast {
      position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
      font-weight: 700; font-size: 1.15rem; opacity: 0; transition: opacity .2s;
      pointer-events: none; text-shadow: 0 2px 8px #000;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="ui">
      <div class="panel" id="menu">
        <div class="brand">CART CHAOS</div>
        <div class="sub">Aisle Racers</div>
        <p class="blurb">Rogue shopping carts tear through MegaMart. Grab soda boosts, chuck soup cans, and dodge banana peels for three laps of aisle mayhem.</p>
        <div class="carts" id="cartPicker"></div>
        <div class="tagline" id="tagline"></div>
        <button class="cta" id="startBtn">START RACE</button>
        <p class="help">← → steer · hold GAS · USE power-up · or A/D + Space + Shift</p>
      </div>
      <div class="panel hidden" id="results">
        <div class="brand" id="resultsTitle">RACE OVER</div>
        <p class="blurb" id="resultsBlurb"></p>
        <div id="standings" style="text-align:left;display:inline-block;margin-bottom:1rem;opacity:.9"></div>
        <div>
          <button class="cta" id="retryBtn">RACE AGAIN</button>
          <button class="cta" id="menuBtn" style="margin-left:.5rem;background:linear-gradient(180deg,#6a736c,#3d4540);color:#f2efe6;box-shadow:0 6px 0 #222">MENU</button>
        </div>
      </div>
    </div>
    <div id="hud" class="hidden">
      <div class="tl"><div class="place" id="place">1st</div><div id="lap">LAP 1/3</div></div>
      <div class="tr"><div id="speed">0 mph</div><div id="item">ITEM: —</div></div>
    </div>
    <div id="countdown" class="hidden"></div>
    <div id="toast"></div>
    <div id="controls" class="hidden">
      <div class="ctrl-group">
        <button class="ctrl" id="leftBtn">◀</button>
        <button class="ctrl" id="rightBtn">▶</button>
      </div>
      <div class="ctrl-group">
        <button class="ctrl gas" id="gasBtn">GAS</button>
        <button class="ctrl use" id="useBtn">USE</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
